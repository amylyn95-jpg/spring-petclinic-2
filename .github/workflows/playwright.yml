# Builds the application with Maven, starts it (H2 profile) and runs the Playwright browser tests in e2e/.

name: Playwright E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build application
        run: ./mvnw -B -DskipTests package
      - name: Start application
        run: |
          java -jar target/*.jar > petclinic.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Application did not start in time"; cat petclinic.log; exit 1
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: e2e
        run: npm test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
