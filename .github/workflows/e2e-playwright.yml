# This workflow runs the Playwright end-to-end suite in e2e/ against the Spring Boot app
# and uploads the recorded videos and HTML report as downloadable artifacts.

name: E2E Tests with Playwright

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'
          cache: maven
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build application jar
        run: ./mvnw -B package -DskipTests
      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: e2e
        env:
          PETCLINIC_JAR: ${{ github.workspace }}/target/spring-petclinic-4.0.0-SNAPSHOT.jar
        run: npx playwright test
      - name: Upload test videos and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: e2e/test-results/**
          retention-days: 7
          if-no-files-found: warn
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/**
          retention-days: 7
          if-no-files-found: warn
